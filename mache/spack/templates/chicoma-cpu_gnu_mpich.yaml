{%- set compiler = "gcc@15.2.0" %}
{%- set mpi = "cray-mpich@9.1.0" %}
spack:
  specs:
  - {{ compiler }}
  - {{ mpi }}%{{ compiler }}
  - cray-libsci
  - "hdf5%{{ compiler }}"
  - "netcdf-c%{{ compiler }}"
  - "netcdf-fortran%{{ compiler }}"
  - "parallel-netcdf%{{ compiler }}"
{%- for spec in specs %}
  - "{{ spec }}%{{ compiler }}"
{%- endfor %}
  concretizer:
    unify: true
  packages:
    all:
      compiler: [{{ compiler }}]
      providers:
        mpi: [{{ mpi }}%{{ compiler }}]
        lapack: [cray-libsci@26.03.0]
        blas: [cray-libsci@26.03.0]
    bzip2:
      externals:
      - spec: bzip2@1.0.6
        prefix: /usr
      buildable: false
    cmake:
      externals:
      - spec: cmake@3.29.6
        prefix: /usr/projects/hpcsoft/tce/23-12/cos2-x86_64-cc80/packages/cmake/cmake-3.29.6/
      buildable: false
    curl:
      externals:
      - spec: curl@7.60.0
        prefix: /usr
      buildable: false
    diffutils:
      externals:
      - spec: diffutils@3.6
        prefix: /usr
      buildable: false
    gettext:
      externals:
      - spec: gettext@0.19.8.1
        prefix: /usr
      buildable: false
    gmake:
      externals:
      - spec: gmake@4.2.1
        prefix: /usr
      buildable: false
    libiconv:
      externals:
      - spec: libiconv@2.31
        prefix: /usr
      buildable: false
    libxml2:
      externals:
      - spec: libxml2@2.9.7
        prefix: /usr
      buildable: false
    ncurses:
      externals:
      - spec: ncurses@6.1
        prefix: /usr
      buildable: false
    openssl:
      externals:
      - spec: openssl@1.1.0i
        prefix: /usr
      buildable: false
    perl:
      externals:
      - spec: perl@5.26.1
        prefix: /usr
      buildable: false
    tar:
      externals:
      - spec: tar@1.30
        prefix: /usr
      buildable: false
    xz:
      externals:
      - spec: xz@5.2.3
        prefix: /usr
      buildable: false
    python:
      externals:
      - spec: python@3.10.9
        prefix: /usr/projects/hpcsoft/common/x86_64/anaconda/2023.03-python-3.10
        modules:
        - python/3.10-anaconda-2023.03
      buildable: false
    gcc:
      externals:
      - spec: {{ compiler }}
        modules:
        - cpe/26.03
        - PrgEnv-gnu/8.7.0
        - gcc/15.2.0
        - craype/2.7.36
        - craype-x86-rome
        - craype-network-ofi
        - libfabric/2.3.1
        - cray-libsci/26.03.0
        extra_attributes:
          compilers:
            c: cc
            cxx: CC
            fortran: ftn
          environment:
            prepend_path:
              LD_LIBRARY_PATH: "/opt/cray/libfabric/2.3.1/lib64"
      buildable: false

    cray-mpich:
      externals:
      - spec: {{ mpi }}
        modules:
        - libfabric/2.3.1
        - cray-mpich/9.1.0
      buildable: false

    cray-libsci:
      externals:
      - spec: cray-libsci@26.03.0
        modules:
        - cray-libsci/26.03.0
      buildable: false

    hdf5:
      externals:
      - spec: hdf5@1.14.3.9~cxx+fortran+hl~java+mpi+shared
        prefix: /cpe/26.03/hdf5-parallel/1.14.3.9/gnu/12.3
      buildable: false

    parallel-netcdf:
      externals:
      - spec: parallel-netcdf@1.12.3+cxx+fortran+pic+shared
        prefix: /cpe/26.03/parallel-netcdf/1.12.3.21/gnu/12.3
      buildable: false

    netcdf-c:
      externals:
      - spec: netcdf-c@4.9.2+mpi~parallel-netcdf
        prefix: /cpe/26.03/netcdf-hdf5parallel/4.9.2.3/gnu/12.3
      buildable: false

    netcdf-fortran:
      externals:
      - spec: netcdf-fortran@4.6.1
        prefix: /cpe/26.03/netcdf-hdf5parallel/4.9.2.3/gnu/12.3
      buildable: false

  compilers:
  - compiler:
      spec: {{ compiler }}
      paths:
        cc: cc
        cxx: CC
        f77: ftn
        fc: ftn
      flags: {}
      operating_system: sles15
      target: x86_64
      modules:
      - cpe/26.03
      - PrgEnv-gnu/8.7.0
      - gcc/15.2.0
      - craype/2.7.36
      - craype-x86-rome
      - craype-network-ofi
      - libfabric/2.3.1
      - cray-libsci/26.03.0
      environment:
        prepend_path:
          LD_LIBRARY_PATH: "/opt/cray/libfabric/2.3.1/lib64"
