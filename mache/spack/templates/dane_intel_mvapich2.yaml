{%- set compiler = "intel-oneapi-compilers@2025.2.0" %}
{%- set mpi = "mvapich2@2.3.7" %}

spack:
  specs:
  - {{ mpi }}
{%- for spec in specs %}
  - "{{ spec }}"
{%- endfor %}
  concretizer:
    unify: true
  toolchains:
    mache:
    - spec: "%c={{ compiler }}"
      when: "%c"
    - spec: "%cxx={{ compiler }}"
      when: "%cxx"
    - spec: "%fortran={{ compiler }}"
      when: "%fortran"
  packages:
    all:
      require: ["%mache"]
      providers:
        mpi: [{{ mpi }}]
    bison:
      externals:
      - spec: bison@3.0.4
        prefix: /usr
      buildable: false
    flex:
      externals:
      - spec: flex@2.6.1+lex
        prefix: /usr
      buildable: false
    perl:
      externals:
      - spec: perl@5.26.3+cpanm+opcode+open+shared+threads
        prefix: /usr
      buildable: false
    automake:
      externals:
      - spec: automake@1.16.1
        prefix: /usr
      buildable: false
    autoconf:
      externals:
      - spec: autoconf@2.69
        prefix: /usr
      buildable: false
    m4:
      externals:
      - spec: m4@1.4.18
        prefix: /usr
      buildable: false
    libtool:
      externals:
      - spec: libtool@2.4.6
        prefix: /usr
      buildable: false
    bzip2:
      externals:
      - spec: bzip2@1.0.6
        prefix: /usr
      buildable: false
    pkgconf:
      externals:
      - spec: pkgconf@1.4.2
        prefix: /usr
      buildable: false
    openssl:
      externals:
      - spec: openssl@1.1.1k
        prefix: /usr
      buildable: false
    gmake:
      externals:
      - spec: gmake@4.2.1
        prefix: /usr
      buildable: false
    cmake:
      externals:
      - spec: cmake@3.23.1
        prefix: /usr/tce
      buildable: false
    curl:
      externals:
      - spec: curl@7.61.1+gssapi+ldap+nghttp2
        prefix: /usr
      buildable: false
    mvapich2:
      externals:
      - spec: {{ mpi }}~cuda~debug+regcache+wrapperrpath ch3_rank_bits=32 file_systems=lustre,nfs,ufs
          process_managers=hydra threads=multiple
        # TODO: reviewer, confirm this prefix on dane.  The directory name
        # tracks the compiler, and E3SM's new dane paths spell the 2025
        # compiler as "intel-2025.2.0" without the "-magic" suffix, so the
        # build may instead be mvapich2-2.3.7-intel-2025.2.0.
        prefix: /usr/tce/packages/mvapich2/mvapich2-2.3.7-intel-2025.2.0-magic
        modules:
        - mvapich2/2.3.7
        - mvapich2-tce/2.3.7
      buildable: false
    intel-oneapi-compilers:
      externals:
      # TODO: reviewer, confirm these paths on dane.  They follow the
      # "-magic" layout the 2023.2.1 entry used, with the version taken
      # from E3SM's new intel/2025.2.0-magic module.
      - spec: {{ compiler }}
        prefix: /usr/tce/packages/intel/intel-2025.2.0-magic
        extra_attributes:
          compilers:
            c: /usr/tce/packages/intel/intel-2025.2.0-magic/bin/icx
            cxx: /usr/tce/packages/intel/intel-2025.2.0-magic/bin/icpx
            fortran: /usr/tce/packages/intel/intel-2025.2.0-magic/bin/ifx
        modules:
        - StdEnv
        - intel/2025.2.0-magic
      buildable: false
    gcc:
      externals:
      - spec: gcc@12.1.1 languages='c,c++,fortran'
        prefix: /usr/tce/packages/gcc/gcc-12.1.1-magic
        extra_attributes:
          compilers:
            c: /usr/tce/packages/gcc/gcc-12.1.1-magic/bin/gcc
            cxx: /usr/tce/packages/gcc/gcc-12.1.1-magic/bin/g++
            fortran: /usr/tce/packages/gcc/gcc-12.1.1-magic/bin/gfortran
      buildable: false
