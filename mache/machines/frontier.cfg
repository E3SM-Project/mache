# Options related to deploying an e3sm-unified conda environment on supported
# machines
[e3sm_unified]

# the unix group for permissions for the e3sm-unified conda environment
group = cli115

# the compiler set to use for system libraries
compiler = craygnu

# the system MPI library
mpi = mpich

# the path to the directory where activation scripts, the base environment, and
# system libraries will be deployed
base_path = /ccs/proj/cli115/software/e3sm-unified

# whether to use E3SM modules for hdf5, netcdf-c, netcdf-fortran and pnetcdf
# (spack modules are used otherwise)
use_e3sm_hdf5_netcdf = True


# config options related to data needed by diagnostics software such as
# e3sm_diags and MPAS-Analysis
[diagnostics]

# The base path to the diagnostics directory
base_path = /lustre/orion/cli115/world-shared/diagnostics

# the unix group for permissions for diagnostics
group = cli115


[inputdata]

# The base path to the inputdata directory
base_path = /lustre/orion/cli115/world-shared/e3sm/inputdata


# The parallel section describes options related to running jobs in parallel
[parallel]

# parallel system of execution: slurm, pbs or single_node
system = slurm

# account for running diagnostics jobs
account = cli115

# available partition(s) (default is the first)
partitions = batch, extended

# available quality of service (default is the first)
qos = normal, debug

# whether to use mpirun or srun to run a task
parallel_executable = srun -l -K --threads-per-core=1

# no gpus per node for the default CPU compiler
gpus_per_node = 0

# cpu cores per node
cores_per_node = 56

# the maximum number of MPI tasks per node
max_mpi_tasks_per_node = 56

# usable memory per node in MB (what the site reports as available to a
# job, rather than the hardware capacity)
#
# SAMPLED, NOT SURVEYED: one node reported 512000 MB, so the value below
# is conservative -- but one node is not the partition.  Replace it with
# the minimum of `sinfo -o "%m" -p <partition>`, and drop this note, once
# someone has run that.
memory_per_node = 480000

# CPU binding (cores or threads)
cpu_bind = threads

# Explicit Slurm rank distribution across nodes/L3 regions.
distribution = block:cyclic

# gpu binding
gpu_bind =


# partition policy metadata for downstream job-script generation
[partition.batch]

# batch is the default partition for production work; the maximum wall clock
# depends on the job-size bin
min_nodes = 1
max_nodes = 9472
max_wallclock_bins = 91: 02:00:00,
                     183: 06:00:00,
                     9472: 12:00:00


[partition.extended]

# extended is for smaller long-running jobs
min_nodes = 1
max_nodes = 64
max_wallclock = 24:00:00


# qos policy metadata for downstream job-script generation
[qos.normal]

# normal adds no limits of its own; the partition is what binds
min_nodes = 1
max_nodes =
max_wallclock =


[qos.debug]

# debug is for short, non-production debugging; jobs asking for more than two
# hours are rejected at submission.  It is only meaningful on the batch
# partition -- extended exists for 24-hour jobs.
min_nodes = 1
max_nodes =
max_wallclock = 02:00:00


# parallel options related to the craygnu-mphipcc compiler
[parallel.craygnu_mphipcc]

# gpus per node on the machine
gpus_per_node = 8

# the maximum number of MPI tasks per node
max_mpi_tasks_per_node = 8

# the maximum number of tasks per gpu
ntasks_per_gpu = 1

# gpu binding
gpu_bind = closest


# parallel options related to the craycray-mphipcc compiler
[parallel.craycray_mphipcc]

# gpus per node on the machine
gpus_per_node = 8

# the maximum number of MPI tasks per node
max_mpi_tasks_per_node = 8

# the maximum number of tasks per gpu
ntasks_per_gpu = 1

# gpu binding
gpu_bind = closest

# Config options related to spack environments
[spack]

# whether the machine uses cray compilers
cray_compilers = True


# config options related to synchronizing files
[sync]

# the full hostname of the machine
hostname = frontier.olcf.ornl.gov


# Options related to machine discovery
[discovery]

# a regular expression used to identify this machine from its hostname
hostname_re = ^frontier
